</style></head><body><main id="stage"><header class="topbar"><button id="contents" class="brand" aria-label="Открыть содержание"><i class="logo"></i><span>ПОЛЕ / <span id="chapter">01</span></span></button><div class="header-caption">ФИЗИКА, КОТОРУЮ ВИДНО</div><nav><button id="profile-toggle" aria-pressed="false">ПРОФИЛЬ <span>＋</span></button><button id="notes-toggle" aria-label="Заметки докладчика">ЗАМЕТКИ</button><button id="fullscreen" aria-label="Полный экран">⛶</button></nav></header><div id="slides"></div><footer><button id="motion" aria-pressed="false"><i class="live-dot"></i><span>Пауза анимации</span></button><div class="footer-hint">← → листать <span>·</span> пробел — пауза <span>·</span> P — профиль</div><div class="pager"><button id="previous" aria-label="Предыдущий экран">←</button><span id="page-count">01 / 11</span><button id="next" aria-label="Следующий экран">ДАЛЕЕ <span>→</span></button></div></footer><div class="progress"><div id="progress-fill"></div></div><aside id="profile" class="profile-panel" hidden aria-label="Профильная часть"><button class="panel-close" data-close="profile" aria-label="Закрыть профильную часть">×</button><div class="eyebrow">ПРОФИЛЬ / ЧУТЬ ГЛУБЖЕ</div><h3 id="profile-title"></h3><div id="profile-body"></div></aside><aside id="notes" class="notes-panel" hidden aria-label="Заметки докладчика"><button class="panel-close" data-close="notes" aria-label="Закрыть заметки">×</button><div class="eyebrow">ЗАМЕТКИ ДОКЛАДЧИКА</div><h3 id="notes-title"></h3><div id="notes-body"></div></aside><div id="menu" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Содержание"><div class="menu-inner"><button class="panel-close" data-close="menu" aria-label="Закрыть содержание">×</button><div class="eyebrow">МАРШРУТ ИССЛЕДОВАНИЯ</div><h2>От заряда<br>до сообщения.</h2><div id="menu-items"></div><p class="menu-help">F — полный экран · N — заметки · R — сброс опыта</p></div></div><div id="toast" role="status" aria-live="polite"></div></main><script>'use strict';
const $=(id)=>document.getElementById(id),TAU=Math.PI*2,C=299792458,colors={cyan:'#cbfffc',mist:'#edfffe',silver:'#bbc7c6',pink:'#fde9ff',line:'#28625c',kelp:'#003734',deep:'#011d1c'};
const cv=(id,w=1000,h=500,cls='')=>`<canvas id="${id}" width="${w}" height="${h}" data-w="${w}" data-h="${h}" class="${cls}" aria-label="Анимированная физическая схема"></canvas>`;
const button=(id,text,cls='')=>`<button id="${id}" class="btn ${cls}">${text}</button>`;
const range=(id,label,min,max,step,value,unit='',ends='')=>`<div class="control-box"><label class="slider-label" for="${id}">${label}<output id="${id}-value">${value}${unit}</output></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}">${ends?`<div class="range-ends"><span>${ends.split('|')[0]}</span><span>${ends.split('|')[1]}</span></div>`:''}</div>`;
const scenes=[
{slug:'start',name:'Увидеть невидимое',section:'01',profileTitle:'Что мы исследуем',profile:`<p>Антенна связывает электрическую цепь с электромагнитным полем в пространстве.</p><div class="formula">цепь ⇄ поле</div><p>В передающем режиме источник питает антенну. В приёмном режиме внешняя волна создаёт напряжение на её выводах.</p><p>Здесь мы исследуем линейные диполи. Это простая модель, а не описание всех существующих антенн.</p>`,notes:`<p>1 минута. Начни с вопроса: «Как сообщение попадает из одного провода в другой, если между ними воздух?»</p><p>Сфера на обложке — атмосферная графика из частиц. Физические схемы начинаются со следующего экрана.</p><p>Клик по фону создаёт световой отклик, движение указателя слегка поворачивает сферу.</p>`,html:`<div class="hero-art">${cv('hero-canvas',1600,900)}</div><div class="hero-copy"><div class="eyebrow">АНТЕННА / ЭЛЕКТРОМАГНИТНЫЕ ВОЛНЫ</div><h1>Увидеть<br>невидимое.</h1><p>Как антенна излучает и принимает волну</p>${button('start','НАЧАТЬ ИССЛЕДОВАНИЕ <span>↗</span>','primary')}</div><div class="hero-steps"><span>01 / ИЗЛУЧЕНИЕ</span><span>02 / РАСПРОСТРАНЕНИЕ</span><span>03 / ПРИЁМ</span></div><div class="hero-caption">ДВИЖЕНИЕ ЗАРЯДОВ. ЭНЕРГИЯ В ПРОСТРАНСТВЕ.</div>`,class:'hero'},
{slug:'charge',name:'Движение зарядов',section:'02',profileTitle:'Постоянный ток и излучение',profile:`<p>Неподвижные заряды создают статическое электрическое поле. Установившийся постоянный ток в неподвижной цепи сам по себе не даёт непрерывного радиоизлучения.</p><p>При включении и выключении возникают переходные процессы. Для периодического излучения в диполе источник поддерживает колебания зарядов.</p><div class="formula">q(t) = q₀ cos(ωt)<br>ω = 2πf</div><p>Излучение связано с ускоренным движением зарядов. Движение электронов на экране сильно увеличено.</p>`,notes:`<p>2 минуты. Сначала покажи выключенный источник. Попроси класс предсказать, что изменится при включении постоянного напряжения.</p><p>Нажми «Постоянное»: возникнет короткий переходный импульс, затем установится разделение зарядов.</p><p>Переключи на переменное напряжение. Заряды колеблются в проводнике; они не летят от передатчика к приёмнику.</p>`,html:`<div class="copy"><div class="eyebrow">01 / ВНУТРИ АНТЕННЫ</div><h2>Всё начинается<br>с зарядов.</h2><p id="charge-description">Подключи источник и посмотри,<br>как поведут себя заряды.</p><div class="small-note"><b id="charge-takeaway">Сейчас источник выключен.</b><span>Точки показывают условные электроны.<br>Их движение многократно увеличено.</span></div></div><div class="content">${cv('charge-canvas')}</div><div class="bottom-controls"><div class="segmented" role="group" aria-label="Тип источника"><button id="mode-off" aria-pressed="true">Выключен</button><button id="mode-dc" aria-pressed="false">Постоянное</button><button id="mode-ac" aria-pressed="false">Переменное</button></div><span class="tag">НАЖМИ НА РЕЖИМ ИСТОЧНИКА</span></div>`},
{slug:'radiation',name:'Рождение волны',section:'03',profileTitle:'Поле не меняется мгновенно',profile:`<p>Изменение распределения зарядов и тока изменяет электромагнитное поле. Возмущение распространяется с конечной скоростью.</p><div class="formula">c ≈ 3 · 10⁸ м/с<br>t задержки = r / c</div><p>Рядом с антенной есть сложное ближнее поле. На рисунке показан условный срез электрического поля в дальней зоне вдоль одного направления.</p><p>После отключения источника ранее излучённая волна продолжает распространяться.</p>`,notes:`<p>3 минуты. Поставь анимацию на паузу и нажми «Шаг ¼ периода» несколько раз.</p><p>Покажи, что соседние участки рисунка соответствуют разным моментам движения источника.</p><p>Нажми «Выключить источник»: рядом с антенной колебания прекратятся, а уже излучённая волна уйдёт за край.</p>`,html:`<div class="copy"><div class="eyebrow">02 / ИЗЛУЧЕНИЕ</div><h2>Заряд движется.<br>Поле меняется.</h2><p>Изменение поля распространяется<br>от антенны со скоростью света.</p><div class="small-note"><b>Электроны колеблются<br>внутри провода.</b><span>Энергию к приёмнику переносит<br>электромагнитная волна.</span></div></div><div class="content">${cv('radiation-canvas')}</div><div class="bottom-controls"><div class="controls">${button('wave-pause','Ⅱ Стоп-кадр')}${button('wave-step','Шаг ¼ периода','outline')}${button('wave-source','Выключить источник','outline')}</div><span class="tag">ВРЕМЯ ЗАМЕДЛЕНО</span></div>`},
{slug:'fields',name:'Электрическое и магнитное поля',section:'04',profileTitle:'Поперечная электромагнитная волна',profile:`<p>В плоской волне в вакууме электрическое и магнитное поля взаимно перпендикулярны и перпендикулярны направлению распространения.</p><div class="formula">E ⟂ B ⟂ направление<br>E = cB</div><p>Поля E и B колеблются в одной фазе. У них разные единицы измерения; длины стрелок на рисунке выбраны для наглядности.</p><p>Синусоида показывает значения поля в разных точках. Она не является траекторией электрона.</p>`,notes:`<p>2 минуты. Включай E и B по отдельности, затем вместе. Поверни рисунок мышью или пальцем.</p><p>Укажи три направления: E, B, распространение. Затем останови анимацию.</p><p>Спроси: «Что перемещается вправо?» Ожидаемый ответ: рисунок поля и энергия, а не вещество антенны.</p>`,html:`<div class="heading"><div class="eyebrow">03 / СТРУКТУРА ВОЛНЫ</div><h2>Два поля.<br>Одно движение энергии.</h2></div><div class="large-number">E ⟂ B</div><div class="wide-content viz wave3d">${cv('fields-canvas',1400,460)}</div><div class="bottom-controls" style="left:64px"><div class="controls">${button('toggle-e','E / включено')}${button('toggle-b','B / включено')}${button('fields-pause','Ⅱ Стоп-кадр','outline')}</div><span class="tag">ПОВЕРНИ СХЕМУ МЫШЬЮ ИЛИ ПАЛЬЦЕМ · ДАЛЬНЯЯ ЗОНА</span></div>`},
{slug:'frequency',name:'Частота и размер',section:'05',profileTitle:'Почему важна высокая частота',profile:`<div class="formula">λ = c / f<br>L ≈ λ / 2</div><p>L — полная длина простого полуволнового диполя. Значения на экране округлены, принято c ≈ 3 · 10⁸ м/с.</p><p>Для короткого относительно длины волны тонкого диполя сопротивление излучения приближённо пропорционально (L/λ)².</p><p>При малом L/λ трудно добиться хорошего согласования и малых потерь. Высокая частота позволяет использовать компактную антенну.</p><p>Низкочастотное излучение тоже возможно. «Чем выше частота, тем всегда лучше» — неверное правило.</p>`,notes:`<p>3 минуты. Сравни 1 кГц и 100 МГц. Это один и тот же принцип полуволнового диполя, но разные масштабы.</p><p>Проведи ползунок медленно: значения меняются по логарифмической шкале.</p><p>Сформулируй вывод полностью: «Высокая частота позволяет эффективно излучать с помощью антенны небольшого размера».</p>`,html:`<div class="heading"><div class="eyebrow">04 / ОДНА ФОРМУЛА МЕНЯЕТ МАСШТАБ</div><h2>Частота меняет<br>масштаб.</h2></div><div class="equation-block"><div class="equation">λ = c / f</div><p>Для полуволнового диполя<br>полная длина L ≈ λ / 2</p></div><div class="compare"><div class="comparison raised"><div class="tag">НИЗКАЯ ЧАСТОТА / 1 кГц</div><div class="metric">150<small>км</small></div><p class="description">Примерная длина диполя</p>${cv('scale-low',280,200)}<div class="wavelength mono">Длина волны λ = 300 км</div></div><div class="comparison recessed"><div class="tag" id="scale-frequency">РАДИОЧАСТОТА / 100 МГц</div><div class="metric" id="scale-length">1,5<small>м</small></div><p class="description">Примерная длина диполя</p>${cv('scale-high',280,200)}<div class="wavelength mono" id="scale-wavelength">Длина волны λ = 3 м</div></div></div><div class="frequency-controls"><div class="frequency-slider"><label class="slider-label" for="scale-slider">Частота<output id="scale-slider-value">100 МГц</output></label><input id="scale-slider" type="range" min="3" max="9" step=".01" value="8"><div class="range-ends"><span>1 кГц</span><span>1 ГГц</span></div></div><div class="segmented" role="group" aria-label="Частотные примеры"><button data-frequency="3">1 кГц</button><button data-frequency="6">1 МГц</button><button data-frequency="8" aria-pressed="true">100 МГц</button></div><div class="takeaway">Выше частота — меньше<br>полуволновой диполь.</div></div>`},
{slug:'resonance',name:'Длина и резонанс',section:'06',profileTitle:'Отклик антенны и согласование',profile:`<div class="formula">f₀ ≈ c / (2L)</div><p>Простой тонкий диполь имеет основной резонанс вблизи L = λ/2. Реальная резонансная длина зависит от толщины, материала и окружения.</p><p>График показывает качественный нормированный отклик возле первого резонанса. Он не является точным расчётом усиления или КПД реальной антенны.</p><p>Для эффективной передачи энергии также нужны согласование с источником и малые потери.</p>`,notes:`<p>2 минуты. Источник оставляем на 100 МГц. Попроси назвать расчётную полную длину диполя: примерно 1,5 м.</p><p>Сначала установи 0,7 м, затем медленно увеличивай. Максимум отклика возникает около расчётной длины.</p><p>Ток у концов полуволнового диполя мал, у точки питания максимален. Нижняя схема иллюстрирует основную моду.</p>`,html:`<div class="copy"><div class="eyebrow">05 / РЕЗОНАНС</div><h2>У антенны<br>есть свой ритм.</h2><p>Источник работает на 100 МГц.<br>Подбери длину диполя.</p>${range('res-length','Полная длина L',.5,2.5,.01,.85,' м','0,50 м|2,50 м')}<div class="readout-row"><div><div class="metric" id="res-f0">176<small>МГц</small></div><div class="tag">РАСЧЁТНЫЙ РЕЗОНАНС</div></div></div><div class="status-text" id="res-status">Антенна слишком короткая.</div></div><div class="resonance-chart viz">${cv('resonance-canvas',1000,350)}</div><div class="resonance-current viz">${cv('current-canvas',1000,150)}</div><div class="bottom-controls"><span class="tag">НОРМИРОВАННЫЙ ОТКЛИК · КАЧЕСТВЕННАЯ МОДЕЛЬ</span>${button('res-match','Подобрать по формуле','outline')}</div>`},
{slug:'receive',name:'Встреча с волной',section:'07',profileTitle:'Как поле создаёт сигнал',profile:`<p>Электрическая составляющая падающей волны действует на заряды в линейной антенне.</p><div class="formula">F = qE<br>U ≈ E · lэфф</div><p>Вторая формула — оценка напряжения холостого хода для подходящей ориентации и достаточно короткой антенны.</p><p>При подключении нагрузки возникает ток. Усилитель может увеличить сигнал за счёт энергии своего источника питания.</p>`,notes:`<p>2 минуты. Нажми «Отправить импульс» и проследи путь пакета волны.</p><p>Когда пакет дойдёт до приёмника, появится напряжение. Подчеркни: электроны в двух антеннах разные.</p><p>Включи усиление и обрати внимание на подпись об отдельном питании усилителя.</p>`,html:`<div class="copy"><div class="eyebrow">06 / ПРИЁМ</div><h2>Поле встретило<br>провод.</h2><p>Волна действует на заряды.<br>На выводах антенны возникает<br>переменное напряжение.</p><div class="small-note"><b id="receive-status">Приёмник ждёт волну.</b><span id="amplifier-note">Нажми «Отправить импульс»<br>и проследи его путь.</span></div></div><div class="content viz">${cv('receive-canvas',1000,500)}</div><div class="bottom-controls"><div class="controls">${button('send-pulse','Отправить импульс ↗','primary')}${button('amplifier','Усилитель / выкл.','outline')}</div><span class="tag">СХЕМА · ВРЕМЯ ЗАМЕДЛЕНО</span></div>`,class:'reception'},
{slug:'orientation',name:'Ориентация и направленность',section:'08',profileTitle:'Два разных угла',profile:`<p>Поляризация: α — угол между осью приёмного диполя и электрическим полем падающей линейно поляризованной волны.</p><div class="formula">Pприёма / Pmax = cos² α</div><p>Направленность: θ — угол между направлением наблюдения и осью короткого передающего диполя.</p><div class="formula">I(θ) / Imax = sin² θ</div><p>Это идеальные зависимости. Отражения и реальные конструкции изменяют картину. Во втором режиме показан короткий диполь.</p>`,notes:`<p>2 минуты. Сначала поверни приёмную антенну до 90°. В идеальной модели отклик станет нулевым.</p><p>Переключи на «Направленность». Здесь поворачивается направление наблюдения относительно передающей антенны.</p><p>Не смешивай эти два эффекта: поляризация описывает ориентацию приёмника к E, диаграмма — распределение излучения в пространстве.</p>`,html:`<div class="copy"><div class="eyebrow">07 / ГЕОМЕТРИЯ СВЯЗИ</div><h2 id="orientation-title">Один поворот<br>меняет приём.</h2><p id="orientation-description">Совмести приёмную антенну<br>с электрическим полем волны.</p></div><div class="polar-tabs segmented" role="group" aria-label="Режим геометрии"><button id="polar-tab" aria-pressed="true">Поляризация</button><button id="pattern-tab" aria-pressed="false">Направленность</button></div><div class="angle-controls">${range('orientation-angle','Угол α',0,90,1,0,'°','Совпадают|Перпендикулярны')}<div class="metric" id="orientation-power">100<small>%</small></div><div class="tag" id="orientation-power-label">ОТ МАКСИМАЛЬНОЙ МОЩНОСТИ ПРИЁМА</div></div><div class="content viz">${cv('orientation-canvas')}</div><div class="bottom-controls"><span class="tag" id="orientation-note">ИДЕАЛЬНАЯ МОДЕЛЬ · ЛИНЕЙНАЯ ПОЛЯРИЗАЦИЯ</span>${button('angle-demo','Повернуть на 90°','outline')}</div>`,class:'direction'},
{slug:'message',name:'Сообщение на несущей',section:'09',profileTitle:'Амплитудная модуляция',profile:`<div class="formula">s(t) = A[1 + μm(t)]cos(2πfсt)</div><p>m(t) — нормированный информационный сигнал; μ — глубина модуляции, от 0 до 1 в этой модели. Частота несущей fс намного больше частот сообщения.</p><p>При амплитудной модуляции сообщение изменяет огибающую быстрых колебаний.</p><p>Приёмник выделяет огибающую и восстанавливает сообщение. В реальных системах используют и другие виды модуляции.</p>`,notes:`<p>2 минуты. Нажимай по порядку «Сообщение», «Несущая», «Модуляция».</p><p>В последнем режиме измени глубину μ. При μ = 0 огибающая перестаёт нести это сообщение.</p><p>Звуковая кнопка демонстрирует слышимую аналогию амплитудной модуляции. Это не реальная радионесущая 100 МГц.</p>`,html:`<div class="copy"><div class="eyebrow">08 / МОДУЛЯЦИЯ</div><h2>Волна несёт<br>сообщение.</h2><p id="mod-description">Сначала — медленные изменения<br>информационного сигнала.</p><div class="small-note"><b>Несущая колеблется быстро.</b><span>Сообщение управляет её огибающей.<br>Приёмник выделяет эти изменения.</span></div></div><div class="mod-stages segmented" role="group" aria-label="Этапы модуляции"><button id="mod-0" aria-pressed="true">01 / Сообщение</button><button id="mod-1" aria-pressed="false">02 / Несущая</button><button id="mod-2" aria-pressed="false">03 / Модуляция</button></div><div class="content viz">${cv('mod-canvas',1000,500)}</div><div class="mod-depth">${range('mod-depth','Глубина модуляции μ',0,1,.01,.75,'','0|1')}</div><div class="mod-caption">${button('sound','Послушать звуковую аналогию ♫','outline')}<span class="tag">НЕСУЩАЯ НА СХЕМЕ ЗАМЕДЛЕНА</span></div>`,class:'modulation'},
{slug:'lab',name:'Виртуальная лаборатория',section:'LAB',profileTitle:'Что рассчитывает лаборатория',profile:`<p>Это учебная модель линейных диполей в свободном пространстве. Расстояние и доступная мощность источника фиксированы.</p><div class="formula">Отклик ∝ A²рез · cos²α · A²фильтра</div><p>Возле первого резонанса используется качественная резонансная кривая. Поворот даёт фактор cos²α. Расстройка приёмника уменьшает отклик фильтра.</p><p>Проценты нормированы относительно лучшей настройки модели. Это не КПД и не прогноз дальности реального устройства.</p><p>Третий опыт сравнивает частоты при фиксированной длине антенны 1,5 м. Диапазон ограничен областью до первого резонанса.</p>`,notes:`<p>8–10 минут. Перед каждым изменением попроси класс предсказать результат.</p><p>Опыт 1: длина около 1,5 м. Опыт 2: ориентация 0°. Опыт 3: частота около 100 МГц для фиксированной антенны.</p><p>Финал: частота передатчика 100 МГц; настрой длину около 1,5 м, угол около 0°, приёмник около 100 МГц.</p><p>Нажимай «Проверить настройку», чтобы зафиксировать успех и открыть переход к следующему опыту.</p>`,html:`<div class="heading"><div class="eyebrow" id="lab-eyebrow">ЛАБОРАТОРИЯ / ОПЫТ 01</div><h2 id="lab-title">Поймай волну.</h2></div><div class="mission-tabs" role="tablist" aria-label="Опыты лаборатории"><button role="tab" id="mission-0" aria-selected="true">01 / Длина</button><button role="tab" id="mission-1" aria-selected="false">02 / Поворот</button><button role="tab" id="mission-2" aria-selected="false">03 / Частота</button><button role="tab" id="mission-3" aria-selected="false">04 / Связь</button></div><div class="lab-panel raised"><h3 id="mission-title">Настрой длину диполя.</h3><p id="mission-description">Найди максимум отклика при частоте 100 МГц.</p><div id="lab-length-control">${range('lab-length','Полная длина антенны',.5,2.5,.01,.85,' м','0,50 м|2,50 м')}</div><div id="lab-angle-control" hidden>${range('lab-angle','Угол к полю E',0,90,1,0,'°','0°|90°')}</div><div id="lab-frequency-control" hidden>${range('lab-frequency','Частота передатчика',3,8,.01,6,'','1 кГц|100 МГц')}</div><div id="lab-tune-control" hidden>${range('lab-tune','Настройка приёмника',90,110,.1,94,' МГц','90 МГц|110 МГц')}</div>${button('lab-check','Проверить настройку ↗','primary')}<p id="lab-feedback" aria-live="polite">Мощность источника фиксирована.</p></div><div class="lab-viz recessed">${cv('lab-canvas',1100,500)}<div class="viz-labels"><span class="tag">ПОЛЕ В ПРОСТРАНСТВЕ</span><span class="tag mono" id="lab-transmitter">100 МГц · λ ≈ 3 м</span></div><div class="lab-message" hidden id="lab-message"><div class="tag">ПЕРЕДАВАЕМОЕ СООБЩЕНИЕ</div><div id="decoded">ПРИВЕТ, 11 КЛАСС</div></div><div class="lab-readout"><div class="tag">ОТКЛИК МОДЕЛИ</div><div class="metric" id="lab-score">0<small>%</small></div><div class="tag" id="lab-signal-status">СЛАБЫЙ</div></div></div><div class="lab-note"><span id="lab-model-note">Учебная модель · время замедлено · размеры условны</span><div class="controls"><button id="lab-reset">↺ Сбросить опыт</button><button id="next-mission" hidden>Следующий опыт →</button></div></div>`,class:'lab'},
{slug:'finish',name:'Связь восстановлена',section:'11',profileTitle:'Что осталось за рамками',profile:`<p>Мы рассмотрели дипольную модель, основной резонанс и линейную поляризацию.</p><p>Реальные системы также учитывают импеданс, согласование, потери, полосу, землю, препятствия, отражения и шум.</p><p>Компактные антенны могут иметь сложную форму и электрическую длину, которая отличается от геометрической.</p><p>Главный вывод сохраняется: отношение размеров антенны к длине волны определяет многие её свойства.</p>`,notes:`<p>1 минута. Верни начальный вопрос: «Как кусок металла передаёт сообщение через пространство?»</p><p>Попроси трёх учеников по очереди объяснить излучение, распространение и приём.</p><p>Для профильной группы: почему высокая частота сама по себе не гарантирует эффективную связь?</p>`,html:`<div class="heading"><div class="eyebrow">ИССЛЕДОВАНИЕ ЗАВЕРШЕНО</div><h2>Теперь невидимое<br>можно объяснить.</h2></div><div class="summary-grid"><div class="summary-card raised"><div class="num">01</div><h3>Излучение</h3><p>Источник заставляет заряды<br>в антенне колебаться.</p></div><div class="summary-card recessed"><div class="num">02</div><h3>Распространение</h3><p>Электромагнитная волна<br>переносит энергию.</p></div><div class="summary-card raised"><div class="num">03</div><h3>Приём</h3><p>Поле действует на заряды<br>в приёмной антенне.</p></div></div><div class="summary-bottom"><p>Высокая частота позволяет эффективно излучать<br>с помощью антенны небольшого размера.</p>${button('back-lab','Вернуться в лабораторию ↗','primary')}</div><div class="summary-links"><span>ОСНОВА ФИЗИЧЕСКОЙ МОДЕЛИ</span><a href="https://openstax.org/books/college-physics-2e/pages/24-2-production-of-electromagnetic-waves" target="_blank" rel="noopener noreferrer">OpenStax / Излучение и приём ↗</a><a href="https://openstax.org/books/university-physics-volume-2/pages/16-2-plane-electromagnetic-waves" target="_blank" rel="noopener noreferrer">OpenStax / Электромагнитные волны ↗</a><a href="https://ocw.mit.edu/courses/6-013-electromagnetics-and-applications-spring-2009/" target="_blank" rel="noopener noreferrer">MIT / Антенны ↗</a></div>`,class:'summary'}
];
